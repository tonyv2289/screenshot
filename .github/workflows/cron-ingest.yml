name: Trigger Condo Ingestion

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron ingestion endpoint
        env:
          APP_BASE_URL: ${{ secrets.CONDO_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CONDO_CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing CONDO_APP_BASE_URL or CONDO_CRON_SECRET secret."
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST "${APP_BASE_URL}/api/cron/ingest" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"full":true}' \
            | tee /tmp/cron-response.json

          echo "Cron response:"
          cat /tmp/cron-response.json
